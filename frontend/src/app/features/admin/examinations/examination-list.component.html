<app-page-header title="Examinations" subtitle="Manage examinations, slots, and results">
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    New Examination
  </button>
</app-page-header>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (!loading() && dataSource.data.length === 0) {
  <app-empty-state
    icon="fact_check"
    title="No examinations yet"
    description="Create your first examination to get started." />
} @else {
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let exam">
          <a class="name-link" (click)="viewDetail(exam)">{{ exam.name }}</a>
        </td>
      </ng-container>

      <ng-container matColumnDef="course">
        <th mat-header-cell *matHeaderCellDef>Course</th>
        <td mat-cell *matCellDef="let exam">{{ exam.courseLabel }}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let exam">{{ exam.typeLabel }}</td>
      </ng-container>

      <ng-container matColumnDef="examiner">
        <th mat-header-cell *matHeaderCellDef>Examiner</th>
        <td mat-cell *matCellDef="let exam">{{ exam.examinerLabel }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let exam">
          <app-status-chip [status]="exam.status" />
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let exam">
          <button mat-icon-button matTooltip="View Details" (click)="viewDetail(exam)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete" color="warn" (click)="deleteExamination(exam)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 25, 50]" pageSize="10" showFirstLastButtons />
  </div>
}
