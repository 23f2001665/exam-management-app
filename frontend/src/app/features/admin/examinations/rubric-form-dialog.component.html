<h2 mat-dialog-title>{{ isEdit ? 'Edit Rubric' : 'New Rubric' }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="form-content">
    <mat-form-field appearance="outline">
      <mat-label>Criterion Name</mat-label>
      <input matInput formControlName="criterion_name" placeholder="e.g. Communication" />
      @if (form.controls.criterion_name.hasError('required')) {
        <mat-error>Criterion name is required</mat-error>
      }
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Max Marks</mat-label>
        <input matInput type="number" formControlName="max_marks" min="1" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Weightage</mat-label>
        <input matInput type="number" formControlName="weightage" min="0" step="0.1" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="2"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="dialogRef.close()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">
      {{ isEdit ? 'Save Changes' : 'Add Rubric' }}
    </button>
  </mat-dialog-actions>
</form>
