<app-page-header title="Users" subtitle="Manage examiners, students and admins">
  <button mat-flat-button color="primary" (click)="openCreateExaminerDialog()">
    <mat-icon>person_add</mat-icon>
    Create Examiner
  </button>
</app-page-header>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (!loading() && dataSource.data.length === 0) {
  <app-empty-state icon="group" title="No users found" />
} @else {
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1">
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let user">{{ fullName(user) }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
        <td mat-cell *matCellDef="let user">
          <mat-chip-set>
            <mat-chip>{{ user.role }}</mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef>Department</th>
        <td mat-cell *matCellDef="let user">{{ user.department || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let user">
          <app-status-chip [status]="user.is_active ? 'active' : 'inactive'" />
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          @if (user.is_active) {
            <button mat-stroked-button color="warn" (click)="toggleActive(user)">
              Deactivate
            </button>
          } @else {
            <button mat-stroked-button color="primary" (click)="toggleActive(user)">
              Activate
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 25, 50]" pageSize="10" showFirstLastButtons />
  </div>
}
